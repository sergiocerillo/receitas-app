<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Minhas Receitas</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="images/fav.svg">
<script>
  // O dark mode só existe dentro da aplicação — o login sempre fica claro,
  // independente do tema salvo ou da preferência do sistema.
  document.documentElement.setAttribute("data-theme", "light");
</script>
</head>
<body>

<main class="login-screen">
  <div style="max-width:380px; width:100%;">
  <div class="page-header" style="justify-content:center; text-align:center; flex-direction:column;">
    <img src="images/login.svg" alt="Minhas Receitas" class="login-logo">
    <p class="picker-hint" style="margin:0;">Digite a senha de acesso para entrar.</p>
  </div>

  <form id="auth-form" class="form-section" novalidate>
    <div class="field" style="margin-bottom:10px;">
      <label for="password">Senha</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Digite a senha" required autofocus autocomplete="current-password" aria-describedby="auth-status">
        <button type="button" id="toggle-password" class="toggle-visibility" aria-label="Mostrar senha" aria-pressed="false">👁</button>
      </div>
    </div>
    <button type="submit" class="btn" id="submit-btn" style="width:100%; justify-content:center; margin-top:14px;">
      <span id="submit-label">Entrar</span>
    </button>
    <p id="auth-status" class="picker-hint" role="alert" style="margin-top:12px; margin-bottom:0; min-height:1.2em;"></p>
  </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
  const statusEl = document.getElementById("auth-status");
  const submitBtn = document.getElementById("submit-btn");
  const submitLabel = document.getElementById("submit-label");
  const passwordInput = document.getElementById("password");

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? "var(--danger)" : "var(--primary)";
  }

  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitLabel.innerHTML = loading
      ? '<span class="spinner" aria-hidden="true"></span> Entrando...'
      : "Entrar";
  }

  document.getElementById("toggle-password").addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    btn.setAttribute("aria-pressed", String(!showing));
    btn.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
    btn.textContent = showing ? "👁" : "🙈";
    passwordInput.focus();
  });

  document.getElementById("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = passwordInput.value;
    if (!password) {
      setStatus("Digite a senha antes de entrar.", true);
      return;
    }
    setStatus("", false);
    setLoading(true);

    try {
      await Auth.signInWithSitePassword(password);
      window.location.href = "index.html";
    } catch (err) {
      setStatus("Senha incorreta. Tente de novo.", true);
      setLoading(false);
      passwordInput.select();
    }
  });

  // Se já estiver logado, pula direto para a home.
  Auth.getUser().then(user => { if (user) window.location.href = "index.html"; });
</script>
</body>
</html>
