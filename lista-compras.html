<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras - Minhas Receitas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-icon">🥗</span>Minhas Receitas</div>
  <nav class="mainnav">
    <a href="index.html" data-page="index.html">Home</a>
    <a href="salgadas.html" data-page="salgadas.html">Salgadas</a>
    <a href="doces.html" data-page="doces.html">Doces</a>
    <div class="dropdown">
      <span>Bebidas ▾</span>
      <div class="dropdown-menu">
        <a href="bebidas-quentes.html">Quentes</a>
        <a href="bebidas-frias.html">Frias</a>
      </div>
    </div>
    <a href="ingredientes.html" data-page="ingredientes.html">Ingredientes</a>
    <a href="lista-compras.html" data-page="lista-compras.html">Lista de compras</a>    <button type="button" id="logout-btn" class="btn secondary small">Sair</button>
  </nav>
</header>

<main>
  <div class="page-header">
    <h1>Lista de compras</h1>
  </div>
  <p class="picker-hint">Escolha as receitas que você vai preparar. Eu junto os ingredientes de todas elas numa lista só (somando quantidades iguais).</p>

  <div class="form-section">
    <h2>Suas receitas</h2>
    <div id="recipe-select" class="no-print"></div>
  </div>

  <button type="button" id="generate-btn" class="btn no-print">Gerar lista de compras</button>

  <div id="result-wrap" style="display:none; margin-top:24px;">
    <div class="form-section">
      <div class="page-header" style="margin-bottom:12px;">
        <h2 style="margin:0;">Sua lista</h2>
        <button type="button" class="btn secondary small no-print" onclick="window.print()">Imprimir</button>
      </div>
      <div id="shopping-list"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>
  let recipes = [];
  const selectEl = document.getElementById("recipe-select");

  document.getElementById("generate-btn").addEventListener("click", () => {
    const selectedIds = Array.from(selectEl.querySelectorAll("input:checked")).map(i => i.value);
    if (!selectedIds.length) {
      alert("Selecione pelo menos uma receita.");
      return;
    }
    const selected = recipes.filter(r => selectedIds.includes(r.id));
    const consolidated = {}; // key: "name|unit" -> {name, unit, amount}

    selected.forEach(r => {
      r.ingredients.forEach(ing => {
        const key = `${ing.name.toLowerCase()}|${ing.unit || ""}`;
        const amount = parseFloat(String(ing.amount).replace(",", "."));
        if (!consolidated[key]) {
          consolidated[key] = { name: ing.name, unit: ing.unit || "", amount: isNaN(amount) ? null : amount, freeform: isNaN(amount) };
        } else if (!isNaN(amount) && !consolidated[key].freeform) {
          consolidated[key].amount = (consolidated[key].amount || 0) + amount;
        }
      });
    });

    const items = Object.values(consolidated).sort((a, b) => a.name.localeCompare(b.name, "pt-BR"));
    const listEl = document.getElementById("shopping-list");
    listEl.innerHTML = items.map(i => `
      <label class="shopping-list-item">
        <input type="checkbox">
        <span>${escapeHTML(i.name)}</span>
        <span style="margin-left:auto; color:var(--on-surface-muted);">${i.amount !== null ? escapeHTML(String(i.amount) + (i.unit ? " " + i.unit : "")) : escapeHTML(i.unit || "")}</span>
      </label>
    `).join("");

    document.getElementById("result-wrap").style.display = "block";
    document.getElementById("result-wrap").scrollIntoView({ behavior: "smooth" });
  });

  (async () => {
    showLoading("recipe-select", "Carregando suas receitas...");
    const user = await Auth.requireAuth();
    if (!user) return;

    recipes = await Storage.getAll();
    if (!recipes.length) {
      selectEl.innerHTML = `<p class="picker-hint">Você ainda não cadastrou nenhuma receita.</p>`;
    } else {
      selectEl.innerHTML = recipes.map(r => `
        <label class="recipe-select-row">
          <input type="checkbox" value="${r.id}">
          <span>${escapeHTML(r.title)} <span class="badge">${CATEGORY_LABELS[r.category]}</span></span>
        </label>
      `).join("");
    }
  })();
</script>
</body>
</html>
