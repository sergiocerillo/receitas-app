<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bebidas Quentes - Minhas Receitas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-icon">🥗</span>Minhas Receitas</div>
  <nav class="mainnav">
    <a href="index.html" data-page="index.html">Home</a>
    <a href="salgadas.html" data-page="salgadas.html">Salgadas</a>
    <a href="doces.html" data-page="doces.html">Doces</a>
    <div class="dropdown open">
      <span>Bebidas ▾</span>
      <div class="dropdown-menu">
        <a href="bebidas-quentes.html">Quentes</a>
        <a href="bebidas-frias.html">Frias</a>
      </div>
    </div>
    <a href="ingredientes.html" data-page="ingredientes.html">Ingredientes</a>
    <a href="lista-compras.html" data-page="lista-compras.html">Lista de compras</a>    <button type="button" id="logout-btn" class="btn secondary small">Sair</button>
  </nav>
</header>

<main>
  <div class="page-header">
    <h1>Bebidas quentes</h1>
    <a class="btn" href="cadastro.html">+ Cadastrar nova receita</a>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Pesquisar nas bebidas quentes...">
  </div>

  <div id="grid" class="recipe-grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/ingredients.js"></script>
<script src="js/app.js"></script>
<script>
  async function refresh() {
    const term = document.getElementById("search-input").value.trim().toLowerCase();
    const all = await Storage.byCategory("bebida-quente");
    const filtered = term
      ? all.filter(r => r.title.toLowerCase().includes(term) || r.ingredients.some(i => i.name.toLowerCase().includes(term)) || (r.tags || []).some(t => t.toLowerCase().includes(term)))
      : all;
    renderGrid("grid", filtered, "Nenhuma bebida quente encontrada.", refresh);
  }
  document.getElementById("search-input").addEventListener("input", refresh);

  (async () => {
    showLoading("grid", "Carregando bebidas quentes...");
    const user = await Auth.requireAuth();
    if (!user) return;
    refresh();
  })();
</script>
</body>
</html>
